# Local, real, live-changing Prometheus datasource for testing
# dash9-prom against — not a mock. See README.md "Test against a live
# datasource" for usage.
#
# Images are pinned to `latest` for simplicity; pin exact tags if you
# need reproducible pulls.
services:
  prometheus:
    image: prom/prometheus:latest
    container_name: dash9-prometheus
    ports:
      # Host port 9091, not 9090: some systems (e.g. Cockpit) already
      # bind 9090, and Docker fails that publish silently rather than
      # erroring. The container listens on 9090 internally regardless
      # (see prometheus.yml's self-scrape target).
      - "9091:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml

  node-exporter:
    image: prom/node-exporter:latest
    container_name: dash9-node-exporter
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
