[workspace]
members = [
    "crates/dash9-core",
    "crates/dash9-prom",
    "crates/dash9-tui",
    "crates/dash9-assist",
    "crates/dash9",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/Ritevista/dash9"

[workspace.dependencies]
dash9-assist = { path = "crates/dash9-assist" }
dash9-core = { path = "crates/dash9-core" }
dash9-prom = { path = "crates/dash9-prom" }
dash9-tui = { path = "crates/dash9-tui" }

anyhow = "1.0.98"
assert_cmd = "2.0.17"
base64 = "0.22.1"
clap = { version = "4.5.40", features = ["derive"] }
crossterm = "0.29.0"
predicates = "3.1.3"
proptest = "1.6.0"
ratatui = "0.30.2"
reqwest = { version = "0.12.15", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tempfile = "3.20.0"
thiserror = "2.0.12"
tokio = { version = "1.45.0", features = ["rt-multi-thread", "macros"] }
toml = "1.1.3"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "allow"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
strip = "symbols"
