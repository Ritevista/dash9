[package]
name = "dash9"
description = "Terminal UI for observability dashboards"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "dash9"
path = "src/main.rs"

[features]
default = ["assist"]
assist = ["dep:dash9-assist"]

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
crossterm = { workspace = true }
dash9-assist = { workspace = true, optional = true }
dash9-core = { workspace = true }
dash9-prom = { workspace = true }
dash9-tui = { workspace = true }
ratatui = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
assert_cmd = { workspace = true }
predicates = { workspace = true }
tempfile = { workspace = true }
